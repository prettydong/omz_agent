<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>zeda DeepWiki</title>
    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem("deepwiki-theme"); } catch (error) {}
        var dark = stored === "dark" ||
          (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b74ff'/%3E%3Cstop offset='1' stop-color='%235b3df5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url(%23g)'/%3E%3Cpath d='M20 21h24L26 43h18' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5h12L9.5 19H18"/></svg>
        </div>
        <div class="brand-text">
          <strong>zeda <span>DeepWiki</span></strong>
          <small>本地 C/C++ 知识库</small>
        </div>
      </div>

      <label class="toc-search">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="toc-filter" type="search" placeholder="筛选页面…" autocomplete="off" spellcheck="false">
      </label>

      <nav id="toc" class="toc" aria-label="Wiki 目录"></nav>

      <div class="sidebar-foot">
        <span id="toc-count" class="toc-count"></span>
        <button id="theme-toggle" class="icon-btn" type="button" title="切换主题"></button>
      </div>
    </aside>

    <main>
      <article id="page" class="md">
        <div class="skeleton" aria-hidden="true">
          <div class="sk sk-title"></div>
          <div class="sk sk-line w92"></div>
          <div class="sk sk-line w78"></div>
          <div class="sk sk-line w85"></div>
          <div class="sk sk-line w60"></div>
        </div>
      </article>

      <section class="ask">
        <div id="answer-card" class="answer-card" hidden>
          <header class="answer-head">
            <span class="answer-dot" aria-hidden="true"></span>
            <strong>AI 回答</strong>
            <button id="answer-close" class="icon-btn small" type="button" title="关闭回答" aria-label="关闭回答">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
          </header>
          <div id="answer" class="answer-body md"></div>
        </div>

        <form id="ask-form" class="ask-form">
          <input id="question" autocomplete="off" spellcheck="false" placeholder="向 AI 询问这个仓库的任何问题，按 / 快速聚焦">
          <button id="ask-btn" type="submit">提问</button>
        </form>
      </section>
    </main>

    <dialog id="source-dialog">
      <header class="dialog-head">
        <div class="dialog-title">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
          <strong id="source-title" class="dialog-path"></strong>
        </div>
        <button id="source-close" class="ghost-btn" type="button">关闭</button>
      </header>
      <div class="code-wrap">
        <div id="source-content" class="code-view"></div>
      </div>
    </dialog>

    <div id="toast" class="toast" role="status" hidden></div>

    <script src="/vendor/marked.js"></script>
    <script src="/vendor/purify.js"></script>
    <script src="/vendor/mermaid.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
